# Builds hakuX from source on GitHub, the native core included: for patches
# that change the core (fps-lock.patch). The other workflow reuses an
# official release's libraries, so a change to the core never reaches it.
#
# Every *.patch in the repository's top folder is applied to the source,
# then the core is built (the first run takes long; later ones are faster
# with the compiler cache), then the APK. It comes out as a release on your
# fork's Releases page.
#
# Run it: Actions > Build APK with core > Run workflow.
name: Build APK with core

on:
  workflow_dispatch:
    inputs:
      fex_ref:
        description: "Branch, tag or commit of rfandango/FEX to build with"
        required: false
        default: "hakuX"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      NDK_VERSION: "29.0.14206865"
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 1500M
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply the patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(./*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No *.patch in the repository's top folder: building the source as it is."
          fi
          for p in "${patches[@]}"; do
            echo "== $p"
            if ! patch -p1 -F0 --dry-run < "$p" > /tmp/dry-run.txt; then
              cat /tmp/dry-run.txt
              echo "ERROR: $p does not fit this source (or another patch changed the same lines)."
              exit 1
            fi
            patch -p1 -F0 < "$p"
          done
          
      - name: Remove unwanted Android resource backups
        run: |
          find android/app/src/main/res -type f \
            \( -name "*.orig" -o -name "*.rej" -o -name "*~" \) \
            -print -delete
            
      - name: Install the Android SDK parts and the build tools
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK=$sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache ninja-build

      - name: Fetch the core's third-party sources
        run: |
          set -euxo pipefail
          deps="$RUNNER_TEMP/native-deps"
          mkdir -p "$deps/root/subprojects"
          clone() {   # url revision directory
            git clone --quiet "$1" "$3"
            git -C "$3" checkout --quiet "$2"
          }
          clone https://github.com/zeux/volk.git 1.4.304 "$deps/volk"
          clone https://github.com/KhronosGroup/glslang.git 16.1.0 "$deps/glslang"
          clone https://github.com/KhronosGroup/SPIRV-Reflect.git vuldone
          sdk-1.4.328.0 "$deps/spirv_reflect"
          clone https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git v3.3.0 "$deps/vma"
          clone https://github.com/libsdl-org/SDL.git release-3.4.18 "$deps/SDL3"
          clone https://github.com/bylaws/libadrenotools.git 8fae8ce "$deps/adrenotools"
          git -C "$deps/adrenotools" submodule update --init --recursive
          git -C "$deps/adrenotools" apply "$GITHUB_WORKSPACE/tools/native/adrenotools-kgsl-context-priority.patch"
          # nv2a_vsh_cpu: the revision the core was written against, which can sit
          # on a branch the clone doesn't bring (a pull request's); failing
          # that, the default branch (the check below says if it won't do)
          export GIT_TERMINAL_PROMPT=0
          vsh="$deps/root/subprojects/nv2a_vsh_cpu"
          git clone --quiet https://github.com/abaire/nv2a_vsh_cpu.git "$vsh"
          if ! git -C "$vsh" checkout --quiet 561fe80; then
            git -C "$vsh" fetch --quiet origin '+refs/*:refs/remotes/all/*' || true
            git -C "$vsh" checkout --quiet 561fe80 || echo "::warning::nv2a_vsh_cpu 561fe80 is not in the repository: using the default branch"
          fi
          git -C "$vsh" log -1 --format='nv2a_vsh_cpu at %h (%cd)'
          clone https://gitlab.freedesktop.org/slirp/libslirp.git v4.7.0 "$deps/libslirp"
          # everything the build reads, checked here instead of one error per run
          missing=0
          for f in volk/volk.c spirv_reflect/spirv_reflect.c glslang/CMakeLists.txt vma/include/vk_mem_alloc.h \
                   SDL3/CMakeLists.txt adrenotools/CMakeLists.txt libslirp/src \
                   root/subprojects/nv2a_vsh_cpu/src/nv2a_vsh_emulator.c \
                   root/subprojects/nv2a_vsh_cpu/src/nv2a_vsh_disassembler.c \
                   root/subprojects/nv2a_vsh_cpu/src/nv2a_vsh_cpu.c \
                   root/subprojects/nv2a_vsh_cpu/src/nv2a_vsh_emulator_execution_state.c; do
            [ -e "$deps/$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          for fn in nv2a_vsh_emu_initialize_xss_execution_state nv2a_vsh_emu_execute_track_context_writes nv2a_vsh_parse_program; do
            grep -rq "$fn" "$vsh/src" || { echo "::error::nv2a_vsh_cpu has no $fn: another revision is needed"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          echo "NC_DEPS=$deps" >> "$GITHUB_ENV"

      - name: Fetch the FEX fork
        run: |
          set -euxo pipefail
          rm -rf external/fex
          git clone --quiet https://github.com/rfandango/FEX.git external/fex
          git -C external/fex checkout --quiet "${{ inputs.fex_ref }}"
          git -C external/fex submodule update --init External/fmt External/range-v3 \
            External/rpmalloc External/unordered_dense External/xxhash Source/Common/cpp-optparse

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-core-${{ github.run_id }}
          restore-keys: ccache-core-

      - name: Build the native core
        run: |
          set -euxo pipefail
          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release \
            -DNC_DEPS="$NC_DEPS" -DHAKUX_FEX_DIR="$GITHUB_WORKSPACE/external/fex" -DHAKUX_LTO=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ninja -C build/native/core hakuxcore
          ccache -s || true
          bash tools/native/app-libs.sh
          
      - name: Check Android resource filenames
        run: |
          echo "Checking Android resources..."
          find android/app/src/main/res -type f \
            \( -name "*.orig" -o -name "*.rej" -o -name "*~" \) \
            -print
            
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug --no-daemon --stacktrace

      - name: Publish it as a release (a link that opens on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          tag="core-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "hakuX with its own core (build ${GITHUB_RUN_NUMBER})" \
            --notes "Debug build: the core built from this source, with the repository's patches. Installs next to the official app."
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag"

      - uses: actions/upload-artifact@v4
        with:
          name: hakuX-core-apk
          path: android/app/build/outputs/apk/debug/*.apk
