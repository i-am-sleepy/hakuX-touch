# Builds hakuX with "swipe to look" from a phone: no NDK, no native build.
# It applies swipe-look-ci.patch (in the repository's top folder) to the source,
# builds the app, and reuses the native libraries of an official release APK.
#
# Run it: Actions > Build APK > Run workflow, and paste the link of an official
# hakuX release APK. The APK comes out as a release on your fork's Releases page.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      native_apk_url:
        description: "Link of an official hakuX release APK (its native libraries are reused)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"



      - name: Apply swipe to look and widescreen mods
        run: |
          set -euo pipefail

          patch_files=(
            "swipe-look-ci.patch"
            "hakuX-widescreen-find.patch"
          )

          for patch_file in "${patch_files[@]}"; do
            if [ ! -f "$patch_file" ]; then
              echo "ERROR: Missing patch file: $patch_file"
              exit 1
            fi

            echo "Checking $patch_file"

            patch --no-backup -p1 -F0 --dry-run < "$patch_file"

            echo "Applying $patch_file"
            patch --no-backup -p1 -F0 < "$patch_file"
          done

          # Remove any backup files left by previous patch operations
          find android -type f \( -name "*.orig" -o -name "*.rej" \) -delete

          echo "Both patches applied successfully!"

      - name: Take the native libraries from the release APK
        env:
          APK_URL: ${{ inputs.native_apk_url }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o release.apk "$APK_URL"
          libs=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$libs"
          unzip -j -o release.apk 'lib/arm64-v8a/*.so' -d "$libs"
          ls -la "$libs"
          test -f "$libs/libhakuxcore.so"

      - name: Check the libraries have every function this source calls
        run: |
          python3 - <<'PY'
          import glob, re, sys
          kotlin = set()
          for f in glob.glob('android/app/src/main/java/**/*.kt', recursive=True):
              kotlin |= set(re.findall(r'external\s+fun\s+(\w+)\s*\(', open(f).read()))
          # only the ones the repo's own native code defines (a few Kotlin declarations are unused)
          defined = set()
          for f in glob.glob('native/**/*', recursive=True):
              if f.endswith(('.c', '.cpp', '.cc', '.h')):
                  defined |= set(re.findall(r'Java_com_rfandango_haku_1x_\w+?_(native\w+)', open(f, errors='ignore').read()))
          need = sorted(kotlin & defined)
          blob = b''.join(open(f, 'rb').read() for f in glob.glob('android/app/src/main/jniLibs/arm64-v8a/*.so'))
          missing = [n for n in need if ('NativeCoreActivity_' + n).encode() not in blob]
          print(len(need), 'JNI functions needed;', len(missing), 'missing from the libraries')
          if missing:
              print('MISSING:', ', '.join(missing))
              print('These libraries are from a different version than this source. Use the APK of the release this source was made from.')
              sys.exit(1)
          PY

      - name: Install the Android SDK parts the project names
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Unit tests (the swipe-to-look engine)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" testDebugUnitTest \
            --tests 'com.rfandango.haku_x.input.TouchLookEngineTest' --no-daemon --stacktrace

      - name: Build the APK
        working-directory: android
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" assembleDebug --no-daemon --stacktrace

      - name: Publish it as a release (a link that opens on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          tag="swipe-look-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "hakuX with swipe to look (build ${GITHUB_RUN_NUMBER})" \
            --notes "Debug build with swipe to look. Installs next to the official app."
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag"

      - uses: actions/upload-artifact@v4
        with:
          name: hakuX-swipe-look-apk
          path: android/app/build/outputs/apk/debug/*.apk
